<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Страница не найдена</title>
<style>
  html, body { height: 100%; margin: 0; background: #0b120d; color: #c7e3c0; font-family: system-ui, -apple-system, sans-serif; }
  .box { min-height: 100%; display: grid; align-content: center; justify-items: center; gap: 14px; padding: 24px; text-align: center; }
  b { font-size: 20px; letter-spacing: .02em; }
  p { margin: 0; font-size: 14px; line-height: 1.4; color: #8fae91; max-width: 320px; }
  a { display: inline-block; margin-top: 6px; padding: 12px 20px; border-radius: 6px; background: #c7e3c0; color: #122016; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
  <div class="box">
    <b>Такой страницы нет</b>
    <p>Адрес набран с ошибкой или страницу унесли в архив вместе с коробками TERRO.</p>
    <a id="home" href="/withBDTERRO/">К началу</a>
  </div>
  <script>
    // На GitHub сайт лежит в подпапке, на зеркале Netlify в корне.
    document.getElementById('home').href = location.hostname.endsWith('github.io') ? '/withBDTERRO/' : '/';
  </script>
</body>
</html>
